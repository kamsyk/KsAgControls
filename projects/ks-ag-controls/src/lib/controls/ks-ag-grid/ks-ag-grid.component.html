<ag-grid-angular
          [class]="gridClass"
          [theme]="theme"
          [style]="style"
          [modules]="modules"
          [rowModelType]="rowModelType"
          [rowData]="useServerSideData ? undefined : rowData"
          [datasource]="datasource"
          [columnDefs]="columnDefs"
          [defaultColDef]="defaultColDef"
          domLayout="autoHeight"
          [pagination]="true"
          [paginationPageSize]="pageSize"
          [cacheBlockSize]="pageSize"
          [animateRows]="true"
          [loading]="loading">
        </ag-grid-angular>
