<form [formGroup]="signUpForm" (ngSubmit)="onSubmit()">
  <mat-form-field appearance="fill">
    <mat-label>Username</mat-label>
    <input matInput formControlName="username" required />
    <mat-error *ngIf="signUpForm.get('username')?.hasError('required')"
      >Username is required</mat-error
    >
  </mat-form-field>
  <mat-form-field appearance="fill">
    <mat-label>Email</mat-label>
    <input matInput formControlName="email" required type="email" />
    @if (signUpForm.get("email")?.hasError("required")) {
      <mat-error>Email is required</mat-error>
    }
    @if (signUpForm.get("email")?.hasError("email")) {
      <mat-error>Invalid email</mat-error>
    }
  </mat-form-field>
  <mat-form-field appearance="fill">
    <mat-label>Password</mat-label>
    <input matInput formControlName="password" required type="password" />
    @if (signUpForm.get("password")?.hasError("required")) {
      <mat-error>Password is required</mat-error>
    }
  </mat-form-field>
  <button
    mat-raised-button
    color="primary"
    type="submit"
    [disabled]="signUpForm.invalid"
  >
    Sign Up
  </button>
</form>
<div style="margin-top: 16px">
  <button mat-stroked-button color="accent" (click)="signInWith('google')">
    Sign up with Google
  </button>
  <button mat-stroked-button color="accent" (click)="signInWith('facebook')">
    Sign up with Facebook
  </button>
  <button mat-stroked-button color="accent" (click)="signInWith('microsoft')">
    Sign up with Microsoft
  </button>
</div>
